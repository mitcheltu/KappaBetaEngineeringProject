name: iOS checks

on:
  push:
    paths: ['Software/iOS/**', 'Software/WebApp/src/services/*Protocol.ts', 'Software/testsAndDemo/tests/history-protocol-fixture.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['Software/iOS/**', 'Software/WebApp/src/services/*Protocol.ts', 'Software/testsAndDemo/tests/history-protocol-fixture.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Software/iOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Software/WebApp/package-lock.json
      - name: Install WebApp protocol test tooling
        working-directory: Software/WebApp
        run: npm ci
      - name: Check shared firmware and WebApp wire fixture
        run: node scripts/validate-web-fixture.mjs
      - name: Verify generated project is current
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- KappaBeta.xcodeproj
      - name: Test portable protocol and storage
        run: swift test
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 -c 'import json, os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/simulators.json")); print("SIMULATOR_ID="+next(v["udid"] for k, a in d["devices"].items() if "iOS" in k for v in a if v["name"].startswith("iPhone")))' >> "$GITHUB_ENV"
      - name: Build app and test transfer lifecycle
        id: native_tests
        run: |
          set -o pipefail
          xcodebuild test -project KappaBeta.xcodeproj -scheme KappaBeta \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath "$RUNNER_TEMP/KappaBetaTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/kappa-beta-xcodebuild.log"
      - name: Summarize Xcode failure
        if: always() && steps.native_tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kappa-beta-xcodebuild.log'
          lines = log.read_text(errors='replace').splitlines() if log.exists() else ['Xcode did not produce a build log.']
          matches = [i for i, line in enumerate(lines) if re.search(r'error:|Testing failed:|failed \(|Could not cast|TEST FAILED|BUILD FAILED', line, re.I)]
          selected = sorted({j for i in matches for j in range(max(0, i - 2), min(len(lines), i + 5))})
          excerpt = '\n'.join(lines[i] for i in selected[:160]) if selected else '\n'.join(lines[-100:])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Xcode failure details\n\n````text\n' + excerpt + '\n````\n\nDownload the `ios-test-diagnostics` artifact for the complete log and Xcode result bundle.\n')
          print(excerpt)
          PY
      - name: Upload Xcode diagnostics
        if: always() && steps.native_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            ${{ runner.temp }}/kappa-beta-xcodebuild.log
            ${{ runner.temp }}/KappaBetaTests.xcresult
          if-no-files-found: warn
          retention-days: 7
